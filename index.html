<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dungeon Dice Monsters Deck Builder</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <script
        src="app.js"
        defer
    ></script>
</head>


<body>

     <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="page-layout">


        <!-- =================================================
             LEFT: DECK
             ================================================= -->

        <section class="deck-panel panel">

            <div class="panel-heading">

                <div>
                    <h2>Your Deck</h2>

                    <div class="description">
                        15 cards · maximum 3 copies per card
                    </div>
                </div>

                <div
                    id="deckCount"
                    class="deck-count"
                >
                    0 / 15
                </div>

            </div>


            <div
                id="deckGrid"
                class="deck-grid"
            ></div>


            <div
                id="deckStats"
                class="deck-stats"
            ></div>

        </section>



        <!-- =================================================
             RIGHT: CARD BROWSER
             ================================================= -->

        <section class="browser-panel panel">


            <!-- HEADER -->

            <div class="panel-heading">

                <div>

                    <h2>
                        Card Browser
                    </h2>

                    <div
                        id="resultCount"
                        class="description"
                    >
                        Loading cards...
                    </div>

                </div>

            </div>



            <!-- =================================================
                 COMPACT FILTER BAR
                 ================================================= -->

            <div class="compact-search-panel">


                <!-- MAIN FILTER ROW -->

                <div class="search-main-row">

                    <input
                        id="searchInput"
                        class="main-search"
                        type="search"
                        placeholder="Search cards..."
                    >


                    <!-- CATEGORY -->

                    <div class="compact-toggle-group">

                        <label>
                            <input
                                type="checkbox"
                                name="category"
                                value="Monster"
                            >
                            <span>M</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="category"
                                value="Spell"
                            >
                            <span>S</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="category"
                                value="Trap"
                            >
                            <span>T</span>
                        </label>

                    </div>



                    <!-- LEVEL -->

                    <div class="compact-toggle-group">

                        <label>
                            <input
                                type="checkbox"
                                name="level"
                                value="1"
                            >
                            <span>L1</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="level"
                                value="2"
                            >
                            <span>L2</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="level"
                                value="3"
                            >
                            <span>L3</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="level"
                                value="4"
                            >
                            <span>L4</span>
                        </label>

                    </div>



                    <!-- SORT -->

                    <select
                        id="sortFilter"
                        class="compact-sort"
                        title="Sort cards"
                    >

                        <option value="name-asc">
                            A–Z
                        </option>

                        <option value="name-desc">
                            Z–A
                        </option>

                        <option value="level-asc">
                            Level ↑
                        </option>

                        <option value="level-desc">
                            Level ↓
                        </option>

                        <option value="hp-desc">
                            HP ↓
                        </option>

                        <option value="atk-desc">
                            ATK ↓
                        </option>

                        <option value="def-desc">
                            DEF ↓
                        </option>

                    </select>



                    <!-- MORE -->

                    <button
                        id="moreFiltersButton"
                        class="compact-button"
                        type="button"
                    >
                        More ▾
                    </button>



                    <!-- RESET -->

                    <button
                        id="resetFiltersButton"
                        class="compact-button icon-button"
                        type="button"
                        title="Reset filters"
                    >
                        ↺
                    </button>

                </div>



                <!-- =================================================
                     ADVANCED FILTERS
                     ================================================= -->

                <div
                    id="advancedFilters"
                    class="advanced-filters"
                >


                    <!-- FIRST ROW -->

                    <div class="advanced-filter-row">

                        <div class="mini-filter wide">

                            <label for="effectSearch">
                                Effect contains
                            </label>

                            <input
                                id="effectSearch"
                                type="search"
                                placeholder="destroy, attack, resurrect..."
                            >

                        </div>


                        <div class="mini-filter">

                            <label for="monsterTypeFilter">
                                Monster Type
                            </label>

                            <select id="monsterTypeFilter">
                                <option value="">
                                    Any
                                </option>
                            </select>

                        </div>


                        <div class="mini-filter">

                            <label for="itemSubtypeFilter">
                                Item Subtype
                            </label>

                            <select id="itemSubtypeFilter">
                                <option value="">
                                    Any
                                </option>
                            </select>

                        </div>


                        <div class="mini-filter">

                            <label for="keywordFilter">
                                Keyword
                            </label>

                            <select id="keywordFilter">
                                <option value="">
                                    Any
                                </option>
                            </select>

                        </div>

                    </div>



                    <!-- STATS -->

                    <div class="stats-filter-row">


                        <!-- HP -->

                        <div class="stat-filter">

                            <strong>
                                HP
                            </strong>

                            <select id="hpOperator">
                                <option value="">Any</option>
                                <option value="<">&lt;</option>
                                <option value="<=">&lt;=</option>
                                <option value="=">=</option>
                                <option value=">=">&gt;=</option>
                                <option value=">">&gt;</option>
                            </select>

                            <input
                                id="hpValue"
                                type="number"
                                min="0"
                                step="10"
                                placeholder="0"
                            >

                        </div>



                        <!-- ATK -->

                        <div class="stat-filter">

                            <strong>
                                ATK
                            </strong>

                            <select id="atkOperator">
                                <option value="">Any</option>
                                <option value="<">&lt;</option>
                                <option value="<=">&lt;=</option>
                                <option value="=">=</option>
                                <option value=">=">&gt;=</option>
                                <option value=">">&gt;</option>
                            </select>

                            <input
                                id="atkValue"
                                type="number"
                                min="0"
                                step="10"
                                placeholder="0"
                            >

                        </div>



                        <!-- DEF -->

                        <div class="stat-filter">

                            <strong>
                                DEF
                            </strong>

                            <select id="defOperator">
                                <option value="">Any</option>
                                <option value="<">&lt;</option>
                                <option value="<=">&lt;=</option>
                                <option value="=">=</option>
                                <option value=">=">&gt;=</option>
                                <option value=">">&gt;</option>
                            </select>

                            <input
                                id="defValue"
                                type="number"
                                min="0"
                                step="10"
                                placeholder="0"
                            >

                        </div>

                    </div>



                    <!-- CRESTS -->

                    <div class="crest-section">

                        <div class="crest-header">

                            <strong>
                                Crests on Back
                            </strong>


                            <label>
                                <input
                                    type="radio"
                                    name="crestMatch"
                                    value="any"
                                >
                                Any
                            </label>


                            <label>
                                <input
                                    type="radio"
                                    name="crestMatch"
                                    value="all"
                                    checked
                                >
                                All
                            </label>

                        </div>


                        <div
                            id="crestFilters"
                            class="crest-filter-grid"
                        ></div>

                    </div>

                </div>

            </div>



            <!-- =================================================
                 CARD LIST
                 ================================================= -->

            <div
                id="cardPool"
                class="card-pool"
            ></div>

        </section>

    </main>



    <!-- =====================================================
         PREVIEW MODAL
         ===================================================== -->

   <div
    id="previewModal"
    class="modal"
    aria-hidden="true"
>

    <button
        class="modal-backdrop"
        data-action="close-preview"
        aria-label="Close preview"
    ></button>


    <div class="preview-window">

        <button
            class="preview-close"
            data-action="close-preview"
            type="button"
        >
            ×
        </button>


        <div class="preview-carousel">

            <button
                id="previewPrevButton"
                class="preview-arrow"
                data-action="preview-prev"
                type="button"
                aria-label="Previous card"
            >
                ‹
            </button>


            <div class="preview-images">

                <div class="preview-image-frame">

                    <img
                        id="previewFrontImage"
                        alt="Card front"
                    >

                </div>


                <div class="preview-image-frame">

                    <img
                        id="previewBackImage"
                        alt="Card back"
                    >

                </div>

            </div>


            <button
                id="previewNextButton"
                class="preview-arrow"
                data-action="preview-next"
                type="button"
                aria-label="Next card"
            >
                ›
            </button>

        </div>


        <div class="preview-add-row">

            <button
                id="previewAddButton"
                class="primary-button"
                data-action="preview-add"
                type="button"
            >
                + Add
            </button>

        </div>

    </div>

</div>
     <!-- =====================================================
     PREVIEW MODAL
     ===================================================== -->

<!-- =====================================================
     PREVIEW MODAL
     ===================================================== -->

<div
    id="previewModal"
    class="modal"
    aria-hidden="true"
>

    <button
        class="modal-backdrop"
        data-action="close-preview"
        type="button"
        aria-label="Close preview"
    ></button>


    <div class="preview-window">

        <button
            class="preview-close"
            data-action="close-preview"
            type="button"
            aria-label="Close preview"
        >
            ×
        </button>


        <div class="preview-carousel">

            <button
                id="previewPrevButton"
                class="preview-arrow"
                data-action="preview-prev"
                type="button"
                aria-label="Previous card"
            >
                ‹
            </button>


            <div class="preview-images">

                <div class="preview-image-frame">

                    <img
                        id="previewFrontImage"
                        alt="Card front"
                    >

                </div>


                <div class="preview-image-frame">

                    <img
                        id="previewBackImage"
                        alt="Card back"
                    >

                </div>

            </div>


            <button
                id="previewNextButton"
                class="preview-arrow"
                data-action="preview-next"
                type="button"
                aria-label="Next card"
            >
                ›
            </button>

        </div>


        <div class="preview-add-row">

            <button
                id="previewAddButton"
                class="primary-button"
                data-action="preview-add"
                type="button"
            >
                + Add
            </button>

        </div>

    </div>

</div>
</body>
</html>
