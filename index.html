<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DDM Card Search & Deck Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>DDM Card Search & Deck Builder</h1>
      <p>Filter the card database and build a 15-card deck.</p>
    </div>
    <button id="clearFiltersBtn" class="secondary">Clear filters</button>
  </header>

  <main class="app-layout">
    <section class="browser-panel">
      <section class="filters surface">
        <div class="filter-grid">
          <label>
            Search everything
            <input id="searchText" type="search" placeholder="Name, effect, type, keyword..." />
          </label>

          <label>
            Effect contains
            <input id="effectText" type="search" placeholder="e.g. destroy, swift..." />
          </label>

          <label>
            Category
            <select id="categoryFilter"><option value="">Any</option></select>
          </label>

          <label>
            Level
            <select id="levelFilter"><option value="">Any</option></select>
          </label>

          <label>
            Monster type
            <select id="monsterTypeFilter"><option value="">Any</option></select>
          </label>

          <label>
            Item type
            <select id="itemTypeFilter"><option value="">Any</option></select>
          </label>

          <label>
            Item subtype
            <select id="itemSubtypeFilter"><option value="">Any</option></select>
          </label>

          <label>
            Keyword
            <select id="keywordFilter"><option value="">Any</option></select>
          </label>

          <label>
            Crest
            <select id="crestFilter"><option value="">Any</option></select>
          </label>

          <label>
            Die roll
            <select id="crestRollFilter">
              <option value="">Any</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </label>

          <label>
            Minimum crest amount
            <input id="crestAmountFilter" type="number" min="1" step="1" placeholder="Any" />
          </label>

          <div class="numeric-filter">
            <span>HP</span>
            <select id="hpOperator">
              <option value="<">&lt;</option>
              <option value="<=">&le;</option>
              <option value="=">=</option>
              <option value=">=">&ge;</option>
              <option value=">">&gt;</option>
            </select>
            <input id="hpValue" type="number" placeholder="Any" />
          </div>

          <div class="numeric-filter">
            <span>ATK</span>
            <select id="atkOperator">
              <option value="<">&lt;</option>
              <option value="<=">&le;</option>
              <option value="=">=</option>
              <option value=">=">&ge;</option>
              <option value=">">&gt;</option>
            </select>
            <input id="atkValue" type="number" placeholder="e.g. 20" />
          </div>

          <div class="numeric-filter">
            <span>DEF</span>
            <select id="defOperator">
              <option value="<">&lt;</option>
              <option value="<=">&le;</option>
              <option value="=">=</option>
              <option value=">=">&ge;</option>
              <option value=">">&gt;</option>
            </select>
            <input id="defValue" type="number" placeholder="Any" />
          </div>

          <label>
            Sort by
            <select id="sortBy">
              <option value="name-asc">Name A–Z</option>
              <option value="name-desc">Name Z–A</option>
              <option value="level-asc">Level low → high</option>
              <option value="level-desc">Level high → low</option>
              <option value="atk-asc">ATK low → high</option>
              <option value="atk-desc">ATK high → low</option>
              <option value="def-asc">DEF low → high</option>
              <option value="def-desc">DEF high → low</option>
              <option value="hp-asc">HP low → high</option>
              <option value="hp-desc">HP high → low</option>
            </select>
          </label>
        </div>
      </section>

      <div class="results-toolbar">
        <strong id="resultCount">0 cards</strong>
      </div>

      <section id="results" class="card-grid" aria-live="polite"></section>
    </section>

    <aside class="deck-panel surface">
      <div class="deck-header">
        <div>
          <h2>Deck Builder</h2>
          <p><strong id="deckCount">0</strong> / 15 cards</p>
        </div>
        <span id="deckStatus" class="deck-status invalid">15 cards required</span>
      </div>

      <div class="deck-rule">
        Maximum <strong>3 copies</strong> of any card.
      </div>

      <div id="deckList" class="deck-list"></div>

      <div class="deck-summary">
        <div><span>Cards</span><strong id="summaryCards">0 / 15</strong></div>
        <div><span>Unique</span><strong id="summaryUnique">0</strong></div>
      </div>

      <div class="deck-actions">
        <button id="exportDeckBtn">Export deck</button>
        <button id="importDeckBtn" class="secondary">Import deck</button>
        <button id="clearDeckBtn" class="danger">Clear deck</button>
        <input id="importDeckInput" type="file" accept=".json,application/json" hidden />
      </div>
    </aside>
  </main>

  <template id="cardTemplate">
    <article class="card-result surface">
      <div class="image-wrap">
        <img class="card-image" alt="" />
        <button class="flip-btn secondary" type="button">Show back</button>
      </div>

      <div class="card-content">
        <div class="title-row">
          <div>
            <h3 class="card-name"></h3>
            <div class="badges card-meta"></div>
          </div>
          <div class="add-area">
            <span class="copy-count"></span>
            <button class="add-btn" type="button">Add to deck</button>
          </div>
        </div>

        <div class="stats"></div>
        <p class="effect"></p>

        <div class="detail-block keywords-block">
          <strong>Keywords</strong>
          <div class="badges keywords"></div>
        </div>

        <div class="detail-block">
          <strong>Dice / Crests</strong>
          <div class="dice-list"></div>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
